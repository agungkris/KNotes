<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KNotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --ink:#16263D; --muted:#5B6B80; --line:#D9E2EC;
  --blue:#2A5D8F; --sky:#D6E8F7; --sky2:#B7D3EC; --sun:#F2B705; --sunbg:#FFF4CC;
  --ok:#1F8A5B; --okbg:#E3F4EC; --late:#C9372C; --latebg:#FBE6E3; --early:#2A5D8F; --earlybg:#E1EDF8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1722; --surface:#172234; --ink:#E8EEF6; --muted:#9AAABD; --line:#2A3A52;
    --blue:#7FB0DE; --sky:#20344D; --sky2:#2D4A6C; --sun:#F5C842; --sunbg:#3A3214;
    --ok:#4CC38A; --okbg:#143528; --late:#F0776C; --latebg:#3A1C1A; --early:#7FB0DE; --earlybg:#1C2F47;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1722; --surface:#172234; --ink:#E8EEF6; --muted:#9AAABD; --line:#2A3A52;
  --blue:#7FB0DE; --sky:#20344D; --sky2:#2D4A6C; --sun:#F5C842; --sunbg:#3A3214;
  --ok:#4CC38A; --okbg:#143528; --late:#F0776C; --latebg:#3A1C1A; --early:#7FB0DE; --earlybg:#1C2F47;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lexend,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand-dot{width:12px;height:12px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px var(--sunbg)}
.lesson-pick{flex:1;min-width:160px;max-width:360px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--blue);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#0F1722}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#0F1722}}

main{max-width:1100px;margin:0 auto;padding:16px 16px 120px}

.hour{margin:4px 0 18px}
.hour-track{position:relative;display:flex;height:44px;border-radius:12px;overflow:hidden;background:var(--sky)}
.seg{position:relative;height:100%;border-right:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;color:var(--blue);background:var(--sky2);min-width:0;overflow:hidden;transition:background .2s}
.seg:nth-child(even){background:var(--sky)}
.seg.past{background:var(--blue);color:var(--surface)}
.seg.cur{background:var(--sun);color:#16263D}
.seg.over{background:repeating-linear-gradient(135deg,var(--latebg) 0 6px,var(--surface) 6px 12px);color:var(--late)}
.class-end{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--ink);border-radius:2px;z-index:3}
.needle{position:absolute;top:-8px;bottom:-8px;width:4px;margin-left:-2px;background:var(--late);border-radius:3px;z-index:4;display:none;box-shadow:0 0 0 2px var(--surface)}
.hour-scale{position:relative;height:20px;font-size:.72rem;color:var(--muted);margin-top:4px}
.hour-scale span{position:absolute;transform:translateX(-50%)}
.hour-scale span:first-child{transform:none}

.teach{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:880px){.teach{grid-template-columns:minmax(320px,400px) 1fr;align-items:start}.side{position:sticky;top:76px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.slide-no{color:var(--muted);font-size:.85rem}
.slide-title{font-size:1.35rem;font-weight:600;line-height:1.25;margin:2px 0 14px;letter-spacing:-.01em}
.timers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timer{border-radius:14px;padding:12px 12px 10px;background:var(--sky)}
.timer.slide{background:var(--sunbg)}
.big{font-size:2.7rem;font-weight:700;line-height:1;letter-spacing:-.03em}
.big.warn{color:#B07F00} .big.over{color:var(--late)}
:root[data-theme="dark"] .big.warn{color:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .big.warn{color:var(--sun)}}
.big-label{color:var(--muted);font-size:.8rem;margin-top:6px;line-height:1.3}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:600;font-size:.9rem;margin-top:14px}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.late{background:var(--latebg);color:var(--late)} .chip.early{background:var(--earlybg);color:var(--early)} .chip.idle{background:var(--sky);color:var(--blue)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:.9rem}
.facts b{display:block;font-size:1.05rem}
.facts span{color:var(--muted);font-size:.8rem}

.kids{margin-top:16px}
.kids-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.kids-head small{color:var(--muted);font-weight:400}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--blue);background:transparent;font-weight:600;font-size:.85rem;color:var(--blue)}
.dot[aria-pressed="true"]{background:var(--blue);color:var(--surface)}
.nokids{color:var(--muted);font-size:.9rem;margin-top:6px}

.script h3,.notes h3{font-size:.95rem;margin:0 0 10px;color:var(--muted);font-weight:500}
.line{padding:12px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0;padding-top:0}
.en{font-size:1.18rem;font-weight:500;line-height:1.45}
.id{color:var(--muted);margin-top:4px;font-size:1rem}
.lang{display:inline-block;font-size:.68rem;font-weight:600;border-radius:5px;padding:1px 5px;margin-right:6px;vertical-align:2px}
.lang.e{background:var(--sky);color:var(--blue)} .lang.i{background:var(--sunbg);color:var(--ink)}
.notes{margin-top:16px;background:var(--sunbg);border:0}
.notes p{margin:0;white-space:pre-wrap;font-size:.95rem}
.next{margin-top:16px;color:var(--muted);font-size:.9rem;display:flex;gap:10px;align-items:center}
.next b{color:var(--ink);font-weight:500}

.controls{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.controls-in{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:12px 16px;border-radius:12px;font-weight:600;min-height:48px}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.controls .btn.primary{flex:1}
:root[data-theme="dark"] .btn.primary{color:#0F1722}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0F1722}}
.btn.go{flex:1.3}
.btn.ghost{border-color:transparent;color:var(--muted);font-weight:500}
.btn.danger{color:var(--late)}
.btn.small{min-height:36px;padding:6px 12px;font-weight:500;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}

.recap table{width:100%;border-collapse:collapse;font-size:.92rem}
.recap th,.recap td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.recap td.r,.recap th.r{text-align:right}
.plus{color:var(--late);font-weight:600} .minus{color:var(--ok);font-weight:600}

.plan-head{display:grid;gap:12px;grid-template-columns:1fr;margin-bottom:14px}
@media (min-width:700px){.plan-head{grid-template-columns:2fr 1fr 1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
label.f input,label.f textarea,label.f select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:1rem}
label.f textarea{min-height:80px;resize:vertical;line-height:1.45}
.sum{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:4px 0 6px;font-size:.95rem}
.sum b{font-size:1.1rem}
.rows{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-btn{width:100%;display:grid;grid-template-columns:28px auto 1fr auto;gap:10px;align-items:center;text-align:left;background:transparent;border:0;padding:12px 14px}
.row-btn:hover{background:var(--bg)}
.row-n{width:28px;height:28px;border-radius:8px;background:var(--sky);color:var(--blue);display:grid;place-items:center;font-weight:600;font-size:.8rem}
.row-t{font-weight:500;line-height:1.3}
.row-meta{color:var(--muted);font-size:.8rem;margin-top:2px}
.row-r{text-align:right;font-size:.85rem;white-space:nowrap}
.row-r b{display:block;font-size:1rem}
.chev{display:inline-block;transition:transform .15s;color:var(--muted);margin-left:6px}
.row.open .chev{transform:rotate(90deg)}
.editor{display:none;padding:4px 14px 16px 52px;gap:12px}
.row.open .editor{display:grid}
.ed-grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.hint{font-size:.78rem;color:var(--muted)}
.ed-actions{display:flex;flex-wrap:wrap;gap:8px}
.ed-actions .btn{min-height:40px;padding:8px 12px;font-weight:500}
.plan-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.last{color:var(--muted)}
.foot{color:var(--muted);font-size:.78rem;margin-top:22px}

/* script pairs */
.pairs-title{font-size:.82rem;color:var(--muted)}
.pairs{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:1fr auto;gap:6px 8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pair textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);resize:vertical;line-height:1.4;min-height:44px}
.pair .pen{font-weight:500}
.pair .pid{color:var(--muted);background:transparent;border-style:dashed}
.pair .x{grid-row:1;grid-column:2;border:0;background:transparent;color:var(--muted);font-size:1.2rem;width:32px;height:32px;border-radius:8px}
.pair .x:hover{background:var(--latebg);color:var(--late)}
.pid-row{grid-column:1/-1;display:grid;gap:4px}
.tstat{font-size:.74rem;color:var(--muted);border:0;background:transparent;padding:0;text-align:left}
.tstat.err{color:var(--late);text-decoration:underline;cursor:pointer}
.tstat.busy{color:var(--blue)}

/* import */
.import{margin-bottom:16px;border:2px dashed var(--sky2);background:var(--surface)}
.import-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.import-top h2{font-size:1.05rem;margin:0;font-weight:600}
.import-top p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.imp-form{display:none;margin-top:14px;gap:12px}
.import.open .imp-form{display:grid}
.imp-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:22px;border-radius:12px;background:var(--sky);color:var(--blue);text-align:center;cursor:pointer;font-weight:500}
.drop small{color:var(--muted);font-weight:400}
.drop.has{background:var(--okbg);color:var(--ok)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.prog{display:grid;gap:4px;font-size:.9rem}
.prog .st{display:flex;gap:8px;align-items:baseline}
.prog .st i{font-style:normal;width:16px;flex:none;text-align:center}
.prog .st.done{color:var(--ok)} .prog .st.err{color:var(--late)} .prog .st.wait{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--sky);overflow:hidden}
.bar>div{height:100%;background:var(--blue);width:0;transition:width .3s}
.msg{padding:10px 12px;border-radius:10px;font-size:.9rem}
.msg.ok{background:var(--okbg);color:var(--ok)} .msg.err{background:var(--latebg);color:var(--late)} .msg.info{background:var(--sky);color:var(--blue)}
.banner{background:var(--sunbg);color:var(--ink);font-size:.88rem;padding:8px 16px;text-align:center;border-bottom:1px solid var(--line)}
.dlg-back{position:fixed;inset:0;background:rgba(10,20,35,.5);display:grid;place-items:center;z-index:60;padding:16px}
.dlg{background:var(--surface);color:var(--ink);border-radius:16px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 12px;font-size:1.1rem}
.dlg p{margin:0 0 16px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn.dangerfill{background:var(--late);border-color:var(--late);color:#fff}
.choice{display:grid;gap:8px;margin-bottom:14px}
.choice button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px}
.choice button b{display:block;font-weight:600}
.choice button span{color:var(--muted);font-size:.86rem}
.choice button:hover{border-color:var(--blue)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:70;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.newbtn{border:1px solid var(--blue);color:var(--blue);background:var(--surface);padding:7px 12px;border-radius:10px;font-weight:600;white-space:nowrap}
.slideview{padding:10px;margin-bottom:16px}
.slideview .frame{aspect-ratio:16/9;width:100%;border-radius:10px;overflow:hidden;background:var(--sky);display:grid;place-items:center;color:var(--muted);font-size:.9rem;text-align:center;padding:12px}
.slideview .frame:has(img){padding:0}
.slideview img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.slideview .cap{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);margin-top:8px;padding:0 4px}
.slideview .cap b{color:var(--ink);font-weight:600}
.thumb{width:72px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--sky);display:grid;place-items:center;font-size:.7rem;color:var(--muted);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.deckbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.deckbar .t span{color:var(--muted);display:block;font-size:.84rem}
.deckdrop{flex-basis:100%;border:2px dashed var(--sky2);border-radius:12px;padding:16px;text-align:center;color:var(--blue);background:var(--bg);cursor:pointer;font-weight:500;transition:background .15s,border-color .15s}
.deckdrop small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.deckdrop:hover,.deckdrop.over{background:var(--sky);border-color:var(--blue)}
.drop.over{background:var(--sky2)}
.slideview .frame.pick{cursor:pointer;border:2px dashed var(--sky2)}
.slideview .frame.pick:hover,.slideview .frame.pick.over{background:var(--sky2);color:var(--blue)}
.dropall{position:fixed;inset:0;z-index:80;background:rgba(42,93,143,.18);display:grid;place-items:center;pointer-events:none;padding:16px}
.dropall div{background:var(--surface);color:var(--blue);border:3px dashed var(--blue);border-radius:18px;padding:28px 32px;font-weight:600;font-size:1.1rem;text-align:center;max-width:420px}
.dropall small{display:block;color:var(--muted);font-weight:400;font-size:.88rem;margin-top:6px}
.pagepick{display:grid;grid-template-columns:1fr 160px;gap:12px;align-items:end}
.pagepick .thumb{width:160px}
@media (max-width:520px){.editor{padding-left:14px}.big{font-size:2.2rem}.controls .btn{padding:12px 10px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="brand-dot" aria-hidden="true"></span>KNotes</div>
    <select class="lesson-pick" id="lessonPick" aria-label="Pilih materi"></select>
    <button class="newbtn" id="newMateri">+ Materi</button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabTeach" aria-selected="true">Mengajar</button>
      <button class="tab" role="tab" id="tabPlan" aria-selected="false">Rencana</button>
    </div>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<main id="main"></main>
<div class="controls" id="controls"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mmss(sec, signed){
  const neg = sec < 0; sec = Math.round(Math.abs(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return (signed ? (neg?'−':'+') : (neg?'−':'')) + m + ':' + String(s).padStart(2,'0');
}
function clockAdd(hhmm, sec){
  const [h,m] = (hhmm||'00:00').split(':').map(Number);
  const t = new Date(2000,0,1,h||0,m||0,0); t.setSeconds(t.getSeconds()+Math.round(sec));
  return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
}
function wallAdd(ms, sec){ const t=new Date(ms+sec*1000); return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'); }
function parseScript(txt){
  return String(txt||'').split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).map(b=>{
    const ls=b.split('\n'); return {en:ls[0], id:ls.slice(1).join(' ')};
  });
}
const mkLines = arr => arr.map(p=>({k:uid(), en:p.en||'', id:p.id||''}));
const sl = (title, min, kids, script, notes='') => ({id:uid(), title, sec:Math.round(min*60), kids, lines:mkLines(parseScript(script.trim())), notes:notes.trim()});

/* ---------- dialogs (confirm/alert diblokir di sebagian browser/iframe) ---------- */
function modal(inner, focusSel){
  return new Promise(res=>{
    const b=document.createElement('div'); b.className='dlg-back';
    b.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${inner}</div>`;
    document.body.appendChild(b);
    const done=v=>{ b.remove(); document.removeEventListener('keydown',kd,true); res(v); };
    const kd=e=>{ if(e.key==='Escape'){ e.stopPropagation(); done(null); } };
    document.addEventListener('keydown',kd,true);
    b.addEventListener('click',e=>{ const t=e.target.closest('[data-v]'); if(t) done(t.dataset.v); else if(e.target===b) done(null); });
    const f=b.querySelector(focusSel||'[data-v="1"]'); f&&f.focus();
  });
}
async function ask(msg,{ok='Ya',cancel='Batal',danger=false}={}){
  const v=await modal(`<p>${esc(msg)}</p><div class="dlg-actions">${cancel?`<button class="btn" data-v="0">${esc(cancel)}</button>`:''}<button class="btn ${danger?'dangerfill':'primary'}" data-v="1">${esc(ok)}</button></div>`);
  return v==='1';
}
const notify=msg=>ask(msg,{ok:'Oke',cancel:''});
function choose(title,opts){
  return modal(`<h3>${esc(title)}</h3><div class="choice">${opts.map(o=>`<button data-v="${o.v}"><b>${esc(o.t)}</b><span>${esc(o.d)}</span></button>`).join('')}</div><div class="dlg-actions"><button class="btn" data-v="">Batal</button></div>`,'.choice button');
}
let toastT=null;
function toast(msg){
  let t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; },3200);
}

let pickerEl=null;
function pickFile(accept){
  return new Promise(res=>{
    if(pickerEl) pickerEl.remove();
    const i=document.createElement('input'); i.type='file'; i.accept=accept;
    i.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(i); pickerEl=i;
    i.addEventListener('change',()=>{ const f=i.files&&i.files[0]; i.remove(); if(pickerEl===i) pickerEl=null; res(f||null); },{once:true});
    i.click();
  });
}

function withTimeout(pr,ms){ return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]); }

/* ---------- slide images (IndexedDB cache + Firebase/akun Claude) ---------- */
const PDF_HINT='Untuk gambar slide, pakai file PDF. Dari PowerPoint: File → Save As → PDF. Dari Canva/Google Slides: Download → PDF.';
const IMG={mem:{},pend:{},dbp:null};
let imgDocFn=null; // k -> remote doc ref
function idbOpen(){
  if(IMG.dbp) return IMG.dbp;
  return IMG.dbp=new Promise(res=>{ try{ const r=indexedDB.open('jamNgajarImg',1); r.onupgradeneeded=()=>r.result.createObjectStore('img'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){ res(null); } });
}
async function idbDo(mode,fn){ const d=await idbOpen(); if(!d) return null; return new Promise(res=>{ try{ const q=fn(d.transaction('img',mode).objectStore('img')); q.onsuccess=()=>res(q.result??null); q.onerror=()=>res(null); }catch(e){ res(null); } }); }
const imgKey=(deck,page)=>deck+'_'+page;
function imgGet(deck,page){
  const k=imgKey(deck,page);
  if(IMG.mem[k]) return Promise.resolve(IMG.mem[k]);
  if(IMG.pend[k]) return IMG.pend[k];
  return IMG.pend[k]=(async()=>{
    let v=await idbDo('readonly',s=>s.get(k));
    if(!v && imgDocFn){ try{ const sn=await imgDocFn(k).get(); if(sn.exists){ v=(sn.data()||{}).img||null; if(v) idbDo('readwrite',s=>s.put(v,k)); } }catch(e){ console.warn(e); } }
    if(v) IMG.mem[k]=v;
    delete IMG.pend[k]; return v;
  })();
}
async function imgPut(deck,page,v){
  const k=imgKey(deck,page); IMG.mem[k]=v;
  await idbDo('readwrite',s=>s.put(v,k));
  if(imgDocFn){ try{ await withTimeout(imgDocFn(k).set({img:v,deck,page}),20000); return true; }catch(e){ console.warn(e); return false; } }
  return true;
}
async function saveDeckImgs(deckId,D,onStep){
  let fail=0; const list=D.filter(s=>s.img);
  for(let i=0;i<list.length;i++){ onStep&&onStep(i+1,list.length); if(!await imgPut(deckId,list[i].n,list[i].img)) fail++; }
  return fail;
}
function dropDeck(deck){
  if(!deck || state.lessons.some(l=>l.deck&&l.deck.id===deck.id)) return;
  for(let p=1;p<=deck.pages;p++){ const k=imgKey(deck.id,p); delete IMG.mem[k]; idbDo('readwrite',s=>s.delete(k)); if(imgDocFn){ try{ imgDocFn(k).delete().catch(()=>{}); }catch(e){} } }
}
function encodeCanvas(cv){
  const LIM=230000; let q=0.72, u=cv.toDataURL('image/jpeg',q);
  while(u.length>LIM && q>0.35){ q-=0.1; u=cv.toDataURL('image/jpeg',q); }
  if(u.length>LIM){ const c2=document.createElement('canvas'); c2.width=Math.round(cv.width*0.7); c2.height=Math.round(cv.height*0.7); c2.getContext('2d').drawImage(cv,0,0,c2.width,c2.height); u=c2.toDataURL('image/jpeg',0.55); }
  return u;
}
function thumbHtml(L,s){ if(!L.deck) return '<span></span>'; return s.page? `<span class="thumb" data-deck="${L.deck.id}" data-page="${s.page}">${s.page}</span>` : '<span class="thumb">—</span>'; }
function slideViewHtml(L,s){
  if(!L.deck) return `<section class="panel slideview"><div class="frame pick" data-deckpick role="button" tabindex="0">Klik atau seret file PDF ke sini<br>supaya slide tiap tahapan tampil saat mengajar.</div></section>`;
  if(!s.page) return `<section class="panel slideview"><div class="frame">Tahapan ini tidak memakai slide.</div></section>`;
  return `<section class="panel slideview"><div class="frame" data-deck="${L.deck.id}" data-page="${s.page}">Memuat slide…</div><div class="cap"><span>Tampilkan di layar: <b>slide ${s.page}</b></span><span>dari ${L.deck.pages} slide</span></div></section>`;
}
function fillImgs(root){
  (root||document).querySelectorAll('[data-deck][data-page]:not([data-filled])').forEach(async el=>{
    el.setAttribute('data-filled','1');
    const src=await imgGet(el.dataset.deck,+el.dataset.page);
    if(!el.isConnected) return;
    if(src){ const im=new Image(); im.alt='Slide '+el.dataset.page; im.src=src; el.textContent=''; el.appendChild(im); }
    else { el.removeAttribute('data-filled'); if(!el.classList.contains('thumb')) el.textContent='Gambar slide '+el.dataset.page+' belum tersedia di perangkat ini.'; }
  });
}

function initFirebase(){
  try{

    imgDocFn=k=>fsDb.collection('jamngajar_slides').doc(k);
    let first=true;

      const d=snap.data()||{};
      if(first){ first=false; if((d.updatedAt||0)<(state.updatedAt||0)) pushRemote(); }
      syncLabel='Tersimpan di Firebase'; updateFoot();
      if(d.by===clientId || !d.json || (d.updatedAt||0)<=(state.updatedAt||0)) return;
      if(isEditing()) pendingRemote=d; else applyRemote(d);
    }, err=>{
      console.warn(err); fsRef=null;
      syncLabel='Tersimpan di perangkat ini saja (Firebase menolak akses, cek Rules)'; updateFoot();
      showBanner('Tidak bisa terhubung ke Firebase. Data tetap tersimpan di browser ini.');

function decodeHtml(s){ const t=document.createElement('textarea'); t.innerHTML=s; return t.value; }
async function mmTranslate(en, signal){
  let r;
  try{ r=await fetch('https://api.mymemory.translated.net/get?langpair=en|id&q='+encodeURIComponent(en.slice(0,480)),{signal}); }
  catch(e){ if(e&&e.name==='AbortError') throw {code:'cancelled'}; throw {code:'offline'}; }
  if(r.status===429) throw {code:'quota'};
  if(!r.ok) throw {code:'http_'+r.status};
  const j=await r.json();
  const st=String(j.responseStatus);
  if(st!=='200'){ throw {code:/LIMIT|QUOTA|USED ALL/i.test(j.responseDetails||'')||st==='429'?'quota':'mt_'+st}; }
  return decodeHtml(j.responseData.translatedText||'');
}
function paintT(k){
  const el=document.querySelector(`.tstat[data-k="${k}"]`); if(!el) return;
  const st=tState[k]||'';
  el.className='tstat'; el.disabled=true;
  if(st==='busy'){ el.classList.add('busy'); el.textContent='Menerjemahkan…'; }
  else if(st==='ok'){ el.textContent='Diterjemahkan otomatis · boleh diedit'; }
  else if(st.startsWith('err:')){ el.classList.add('err'); el.disabled=false; el.textContent=st.slice(4)+' Ketuk untuk coba lagi.'; }
  else el.textContent = 'Terjemahan otomatis muncul setelah kamu selesai mengetik';
}

/* ---------- run (live class) ---------- */
function freshRun(){ return {lessonId:lesson().id, idx:0, base:0, segStart:0, running:false, startedWall:null, enter:{0:0}, actual:{}, kids:{}, done:false}; }
if(!run || run.lessonId!==lesson().id) run=freshRun();
function elapsed(){ return run.base + (run.running ? (Date.now()-run.segStart)/1000 : 0); }
function plannedStarts(L){ const a=[]; let t=0; L.slides.forEach(s=>{a.push(t); t+=s.sec;}); return {starts:a,total:t}; }
function startPause(){
  if(run.done) return;
  if(run.running){ run.base=elapsed(); run.running=false; releaseWake(); }
  else { run.segStart=Date.now(); run.running=true; if(!run.startedWall) run.startedWall=Date.now()-run.base*1000; askWake(); }
  saveRun(); renderControls(); tick();
}
function leaveSlide(){
  const L=lesson(), s=L.slides[run.idx]; if(!s) return;
  const E=elapsed(), ent=run.enter[run.idx] ?? E;
  run.actual[s.id]=(run.actual[s.id]||0)+(E-ent);
}
function go(delta){
  const L=lesson();
  if(run.done && delta<0){ run.done=false; run.idx=L.slides.length-1; run.enter[run.idx]=elapsed(); saveRun(); renderTeach(); return; }
  if(run.done) return;
  const ni=run.idx+delta;
  if(ni<0) return;
  leaveSlide();
  if(ni>=L.slides.length){
    run.base=elapsed(); run.running=false; run.done=true; releaseWake();
    L.lastActual={...run.actual, _total:run.base}; save();
  } else { run.idx=ni; run.enter[ni]=elapsed(); }
  saveRun(); renderTeach(); window.scrollTo({top:0});
}
async function resetRun(){
  if(run.base>0||run.running||run.idx>0){
    if(!await ask('Ulang kelas dari awal? Timer kembali ke 0:00 dan tanda anak yang sudah menjawab dikosongkan.',{ok:'Ulang dari awal',danger:true})) return;
  }
  releaseWake(); run=freshRun(); saveRun(); renderTeach(); window.scrollTo({top:0});
  toast('Kelas diulang. Tekan "Mulai kelas" saat siap.');
}
let wake=null;
async function askWake(){ try{ if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){} }
function releaseWake(){ try{ wake && wake.release(); }catch(e){} wake=null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && run.running) askWake(); });

/* ---------- the hour bar ---------- */
function hourBar(L, live){
  const {starts,total}=plannedStarts(L), cls=L.classMin*60, scale=Math.max(total,cls)||1;
  let segs='';
  L.slides.forEach((s,i)=>{
    const w=s.sec/scale*100, over=starts[i]+s.sec>cls+0.5;
    let c='seg'; if(live && !run.done){ if(i<run.idx) c+=' past'; else if(i===run.idx) c+=' cur'; } else if(live && run.done) c+=' past';
    if(over && !(live && (i<=run.idx))) c+=' over';
    segs+=`<div class="${c}" style="width:${w}%" title="${esc(s.title)}">${w>3?i+1:''}</div>`;
  });
  const endPos=cls/scale*100;
  let scaleHtml=''; for(let m=0;m<=L.classMin;m+=15){ scaleHtml+=`<span style="left:${(m*60)/scale*100}%">${m}′</span>`; }
  return `<div class="hour" aria-label="Rencana satu jam">
    <div class="hour-track">${segs}${endPos<100?`<div class="class-end" style="left:${endPos}%" title="Kelas berakhir"></div>`:''}<div class="needle" id="needle"></div></div>
    <div class="hour-scale">${scaleHtml}</div></div>`;
}

function recapHtml(L){
  const act=run.actual; let rows='', tp=0, ta=0;
  L.slides.forEach((s,i)=>{ const a=act[s.id]||0, d=a-s.sec; tp+=s.sec; ta+=a;

  const cls=L.classMin*60, over=ta-cls;
  return `<section class="panel recap">
    <div class="slide-title">Kelas selesai di menit ${mmss(ta)}</div>
    <p class="id">${over>0?`Lewat ${mmss(over)} dari ${L.classMin} menit.`:`Masih sisa ${mmss(-over)} dari ${L.classMin} menit.`} Merah = lebih lama dari rencana, hijau = lebih cepat. Pakai ini untuk merapikan durasi di tab Rencana.</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Tahap</th><th class="r">Rencana</th><th class="r">Aktual</th><th class="r">Selisih</th></tr></thead>
    <tbody>${rows}<tr><th>Total</th><th class="r num">${mmss(tp)}</th><th class="r num">${mmss(ta)}</th><th class="r num">${mmss(ta-tp,true)}</th></tr></tbody></table></div>
  </section><p class="foot" id="foot"></p>`;
}
function renderControls(){
  const c=$('#controls');
  if(view!=='teach'){ c.style.display='none'; return; }
  c.style.display='';
  const L=lesson(), last=run.idx===L.slides.length-1;
  if(run.done){
    c.innerHTML=`<div class="controls-in"><button class="btn" id="bPrev">Kembali</button><button class="btn primary" id="bReset">Mulai kelas baru</button></div>`;
    $('#bPrev').onclick=()=>go(-1); $('#bReset').onclick=()=>{ run=freshRun(); saveRun(); renderTeach(); };
    return;
  }
  c.innerHTML=`<div class="controls-in">
    <button class="btn" id="bPrev" ${run.idx===0?'disabled':''} aria-label="Tahap sebelumnya">◀</button>
    <button class="btn ${run.running?'':'primary'}" id="bPlay">${run.running?'Jeda':(run.base>0?'Lanjut':'Mulai kelas')}</button>
    <button class="btn ${run.running?'primary':''} go" id="bNext">${last?'Selesai':'Tahap berikutnya ▶'}</button>
    <button class="btn ghost" id="bReset" title="Ulang dari awal">Ulang</button>
  </div>`;
  $('#bPrev').onclick=()=>go(-1); $('#bNext').onclick=()=>{ if(!run.running && run.base===0) startPause(); go(1); };
  $('#bPlay').onclick=startPause; $('#bReset').onclick=resetRun;
}

/* ---------- tick ---------- */
function tick(){
  if(view!=='teach') return;
  const L=lesson(), {starts,total}=plannedStarts(L), cls=L.classMin*60, scale=Math.max(total,cls)||1;
  const E=elapsed(), nd=$('#needle');
  if(nd){ if(E>0||run.running){ nd.style.display='block'; nd.style.left=Math.min(100,E/scale*100)+'%'; } else nd.style.display='none'; }
  if(run.done || !$('#remain')) return;
  const s=L.slides[run.idx], ent=run.enter[run.idx] ?? 0, sEl=Math.max(0,E-ent);
  const remain=s.sec-sEl, drift=(ent-starts[run.idx])+Math.max(0,sEl-s.sec);
  const r=$('#remain'); r.textContent = remain>=0? mmss(remain) : mmss(remain,true);
  r.className='big num'+(remain<0?' over':(remain<=60&&(run.running||E>0)?' warn':''));
  $('#remainLbl').innerHTML = remain<0? 'lewat dari<br>rencana tahap' : 'sisa waktu<br>tahap ini';
  const el=$('#elapsed'); el.textContent=mmss(E);
  el.className='big num'+(E>cls?' over':(E>cls-300?' warn':''));
  const cl=$('#classLeft'); cl.textContent = E<=cls? mmss(cls-E) : 'lewat '+mmss(E-cls);
  const wallBase = run.startedWall;
  const endRel = starts[run.idx]+s.sec;
  $('#target').textContent = `menit ${mmss(endRel)} · ${wallBase? wallAdd(wallBase,endRel) : clockAdd(L.startClock,endRel)}`;
  const projRel = total+drift;
  $('#proj').textContent = `${mmss(projRel)} · ${wallBase? wallAdd(wallBase,projRel) : clockAdd(L.startClock,projRel)}`;
  $('#proj').style.color = projRel>cls+30? 'var(--late)' : '';
  const chip=$('#chip');
  if(!run.running && E===0){ chip.className='chip idle'; chip.textContent=`Siap mulai · rencana ${mmss(total)}`; }
  else if(!run.running){ chip.className='chip idle'; chip.textContent='Dijeda'; }
  else if(drift>=30){ chip.className='chip late'; chip.textContent=`Telat ${mmss(drift)} — percepat`; }
  else if(drift<=-30){ chip.className='chip early'; chip.textContent=`Lebih cepat ${mmss(-drift)} — boleh tambah 1 anak`; }
  else { chip.className='chip ok'; chip.textContent='Tepat waktu'; }
}
setInterval(tick,250);

let deckBusy=false;
async function attachDeck(lessonId,f){
  if(!isPdf(f)){ notify(PDF_HINT); return; }
  if(deckBusy){ toast('Masih memproses file sebelumnya, tunggu sebentar.'); return; }
  deckBusy=true;
  const say=(t,k='info')=>{ const box=$('#deckProg'); if(box){ box.style.display=''; box.innerHTML=`<div class="msg ${k}">${esc(t)}</div>`; } else if(k!=='err') toast(t); };
  say('Membuka '+f.name+'…');
  try{
    let r;
    try{ r=await readPdf(f, t=>say(t)); }
    catch(e){ if(e&&e.libFail) throw e; throw Object.assign(new Error('read'),{cause:e}); }
    if(!r.slides.length) throw Object.assign(new Error('read'),{empty:true});
    const deckId=uid();
    const fail=await saveDeckImgs(deckId, r.slides, (i,n)=>say(`Menyimpan gambar slide ${i}/${n}`));
    const L=state.lessons.find(l=>l.id===lessonId);   // ambil versi terbaru, bukan salinan lama
    if(!L){ dropDeck({id:deckId,pages:r.slides.length}); throw Object.assign(new Error('gone'),{gone:true}); }
    const old=L.deck, hadMap=!!old;
    L.deck={id:deckId, name:f.name, pages:r.slides.length};
    if(!hadMap) L.slides.forEach((s,i)=>{ s.page = i<r.slides.length? i+1 : null; });
    else L.slides.forEach(s=>{ if(s.page>r.slides.length) s.page=null; });
    save(); dropDeck(old); render();
    toast(hadMap? `File slide diganti: ${r.slides.length} slide.` : `Slide terpasang (${r.slides.length} slide). Tahap 1 = slide 1, dan seterusnya.`);
    if(fail) notify(`${fail} gambar slide gagal disimpan ke ${syncName}, jadi hanya tampil di perangkat ini. Kalau pakai Firebase, cek Rules untuk jamngajar_slides.`);
  }catch(e){
    console.warn(e, e&&e.cause);
    const msg = e&&e.libFail? 'Pembaca PDF gagal dimuat. Cek koneksi internet, lalu muat ulang halaman dan coba lagi.'
      : e&&e.gone? 'Materinya sudah dihapus, file tidak dipasang.'
      : e&&e.empty? 'PDF ini tidak punya halaman.'
      : 'PDF tidak bisa dibaca'+(e&&e.cause&&e.cause.name==='PasswordException'?' karena dikunci password':'')+'. Coba ekspor ulang file-nya sebagai PDF.';
    say(msg,'err'); if(!$('#deckProg')) notify(msg);
  }
  deckBusy=false;
}

const libs={};
function loadScript(src){
  if(libs[src]) return libs[src];
  return libs[src]=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>{ delete libs[src]; rej(new Error('Gagal memuat '+src)); }; document.head.appendChild(s); });
}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const JSZIP='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
const MAXS=40;

async function readPdf(file, onStep){
  try{ await loadScript(PDFJS); await loadScript(PDFW); }catch(e){ throw Object.assign(new Error('lib'),{libFail:true}); }
  const lib=window.pdfjsLib; if(!lib) throw Object.assign(new Error('lib'),{libFail:true}); lib.GlobalWorkerOptions.workerSrc=PDFW;
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
  const n=Math.min(pdf.numPages,MAXS), out=[];
  for(let i=1;i<=n;i++){
    onStep(`Membaca slide ${i}/${n}`);
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    let text=''; tc.items.forEach(it=>{ text+=it.str+(it.hasEOL?'\n':' '); });
    text=text.replace(/[ \t]+/g,' ').replace(/\n\s*\n+/g,'\n').trim();
    let image=null, img=null;
    try{
      const v0=page.getViewport({scale:1}), sc=Math.min(2,1000/v0.width), vp=page.getViewport({scale:sc});
      const cv=document.createElement('canvas'); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
      const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
      await page.render({canvasContext:ctx, viewport:vp}).promise;
      img=encodeCanvas(cv);
      if(sampleImages) image=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.72));
    }catch(e){ console.warn(e); }
    out.push({n:i, text, notes:'', image, img});
  }
  return {slides:out, total:pdf.numPages};
}
async function readPptx(file, onStep){
  await loadScript(JSZIP);
  const zip=await window.JSZip.loadAsync(await file.arrayBuffer());
  const xml=async p=>{ const f=zip.file(p); return f? new DOMParser().parseFromString(await f.async('string'),'application/xml') : null; };
  const textOf=doc=>{ if(!doc) return ''; return Array.from(doc.getElementsByTagName('a:p')).map(p=>Array.from(p.getElementsByTagName('a:t')).map(t=>t.textContent).join('')).filter(x=>x.trim()).join('\n'); };
  let order=[];
  try{
    const pres=await xml('ppt/presentation.xml'), rels=await xml('ppt/_rels/presentation.xml.rels');
    const map={}; Array.from(rels.getElementsByTagName('Relationship')).forEach(r=>map[r.getAttribute('Id')]=r.getAttribute('Target'));
    order=Array.from(pres.getElementsByTagName('p:sldId')).map(s=>map[s.getAttribute('r:id')]).filter(Boolean).map(t=>'ppt/'+t.replace(/^\/?ppt\//,'').replace(/^\.\.\//,''));
  }catch(e){}
  if(!order.length){
    order=Object.keys(zip.files).filter(p=>/^ppt\/slides\/slide\d+\.xml$/.test(p)).sort((a,b)=>+a.match(/(\d+)\.xml/)[1]-+b.match(/(\d+)\.xml/)[1]);
  }
  const total=order.length; order=order.slice(0,MAXS); const out=[];
  for(let i=0;i<order.length;i++){
    onStep(`Membaca slide ${i+1}/${order.length}`);
    const path=order[i]; const text=textOf(await xml(path));
    let notes='';
    try{
      const rp=path.replace(/slides\/(slide\d+\.xml)$/,'slides/_rels/$1.rels'); const rel=await xml(rp);
      const n=rel && Array.from(rel.getElementsByTagName('Relationship')).find(r=>/notesSlide/.test(r.getAttribute('Type')||''));
      if(n){ const np='ppt/'+n.getAttribute('Target').replace(/^\.\.\//,''); notes=textOf(await xml(np)).replace(/^\d+\s*$/m,'').trim(); }
    }catch(e){}
    out.push({n:i+1, text, notes, image:null});
  }
  return {slides:out, total};
}

async function runImport(){
  if(!impFile) return;
  const st=state.settings;
  st.teacher=$('#impTeacher').value.trim()||'Guru'; st.level=$('#impLevel').value; st.students=Math.max(1,+$('#impStudents').value||8); save();
  const classMin=Math.max(10,+$('#impMin').value||60), startClock=$('#impStart').value||'19:00';
  impCtl=new AbortController(); const signal=impCtl.signal;
  $('#impGo').disabled=true; $('#impStop').hidden=false;
  const steps=[{t:'Membaca file',st:'busy'},{t:'Membagi waktu per slide',st:'wait'},{t:'Menulis naskah per slide',st:'wait'}];
  progList(steps,3);
  try{
    const isPdf=/\.pdf$/i.test(impFile.name)||impFile.type==='application/pdf';
    const deck = isPdf? await readPdf(impFile, t=>{ steps[0].t=t; progList(steps,5); }) : await readPptx(impFile, t=>{ steps[0].t=t; progList(steps,5); });
    if(signal.aborted) throw {code:'cancelled'};
    const D=deck.slides; if(!D.length) throw new Error('Tidak ada slide yang terbaca dari file ini.');
    steps[0]={t:`File terbaca: ${D.length} slide`+(deck.total>D.length?` (dibatasi ${MAXS} slide pertama)`:''),st:'done'};
    if(!sampleFn){
      const per=Math.max(0.5, Math.floor(((classMin-3)/D.length)*2)/2);
      const L={id:uid(), title:impFile.name.replace(/\.(pdf|pptx)$/i,''), classMin, startClock, lastActual:null,
        slides:D.map(s=>({id:uid(), title:((s.text||'').split('\n').find(x=>x.trim())||`Slide ${s.n}`).slice(0,90), sec:Math.round(per*60), kids:0,
          page:s.n, lines:[{k:uid(),en:'',id:''}], notes:[s.text,s.notes].filter(Boolean).join('\n\n').slice(0,2000)}))};
      await finishImport(L,0,D,impFile.name);
    } else {
    steps[1].st='busy'; progList(steps,12);

    const deckText=D.map(s=>`--- Slide ${s.n} ---\n${(s.text||'(tidak ada teks — kemungkinan gambar/video)').slice(0,1500)}${s.notes?`\n[Catatan pembicara] ${s.notes.slice(0,600)}`:''}`).join('\n\n');
    const outline=await sampleFn.json(
`Kamu membantu guru les bahasa Inggris online untuk murid ${st.level} di Indonesia merencanakan kelas ${classMin} menit dari slide berikut. Kelas berisi sekitar ${st.students} murid; guru memanggil murid satu per satu untuk menjawab/membaca.

${deckText}

Buat rencana waktu. Aturan:
- Tepat ${D.length} item, satu per slide, urutan sama.
- Boleh menambah SATU item terakhir dengan "slide": null berjudul "Closing — recap & salam penutup" HANYA jika slide terakhir bukan penutup/rekap.
- "minutes" kelipatan 0,5. Total semua menit antara ${classMin-5} dan ${classMin-2} (sisakan cadangan).
- Cover/pembuka ±1 menit (sapaan + perkenalan). Aktivitas membaca banyak kalimat, diskusi, atau presentasi murid dapat waktu paling banyak. Slide video/listening: perkirakan durasi video + menjawab.
- "kids": berapa murid yang perlu menjawab/membaca di slide itu (0 bila guru saja yang bicara), maksimal ${st.students}.
- "title": label singkat bahasa Indonesia yang menyebut aktivitas, contoh "Warm-up — raincoat atau umbrella?".
- "activity": satu kalimat bahasa Indonesia tentang apa yang terjadi di slide itu.
Selain itu beri "lessonTitle": judul materi singkat (topik + jenjang).
Balas hanya JSON: {"lessonTitle":"...","items":[{"slide":1,"title":"...","minutes":1,"kids":0,"activity":"..."}]}`,
      {signal});
    let items=Array.isArray(outline&&outline.items)? outline.items : [];
    // align to slides
    const plan=D.map((s,i)=>{ const it=items.find(x=>x&&x.slide===s.n)||items[i]||{}; return {
      slide:s, title:String(it.title||(s.text.split('\n')[0]||`Slide ${s.n}`)).slice(0,90),
      minutes:Math.max(0.5,+it.minutes||3), kids:Math.max(0,Math.min(st.students,parseInt(it.kids,10)||0)), activity:String(it.activity||'') }; });
    const extra=items.find(x=>x&&x.slide===null);
    if(extra) plan.push({slide:null, title:String(extra.title||'Closing — recap & salam penutup'), minutes:Math.max(1,+extra.minutes||5), kids:Math.max(0,Math.min(st.students,parseInt(extra.kids,10)||2)), activity:String(extra.activity||'Rekap materi dan salam penutup')});
    let tot=plan.reduce((a,p)=>a+p.minutes,0);
    if(tot>classMin-2){ const f=(classMin-2)/tot; plan.forEach(p=>p.minutes=Math.max(0.5,Math.round(p.minutes*f*2)/2)); }
    tot=plan.reduce((a,p)=>a+p.minutes,0);
    steps[1]={t:`Waktu terbagi: ${plan.length} bagian, total ${String(tot).replace('.',',')} menit`,st:'done'};
    steps[2].st='busy'; progList(steps,25);

    const results=new Array(plan.length); let done=0, failed=0;
    const worker=async()=>{
      while(true){
        if(signal.aborted) return;
        const i=results.findIndex((r,j)=>r===undefined && !worker.taken.has(j)); if(i<0) return;
        worker.taken.add(i);
        const p=plan[i], prev=plan[i-1], next=plan[i+1];
        const input=
`Tulis naskah ucapan guru untuk satu bagian kelas bahasa Inggris online. Murid ${st.level} di Indonesia, jadi guru (${st.teacher}) mengucapkan bahasa Inggris dulu, lalu mengulanginya dalam bahasa Indonesia lisan yang santai dan ramah ("kamu", "ya", "yuk").
Materi: "${outline.lessonTitle||impFile.name}". Bagian ${i+1} dari ${plan.length}: "${p.title}", ${String(p.minutes).replace('.',',')} menit, memanggil ${p.kids} murid. Aktivitas: ${p.activity}
${p.slide? `Teks di slide:\n${(p.slide.text||'(tidak ada teks)').slice(0,2500)}${p.slide.notes?`\nCatatan pembicara: ${p.slide.notes.slice(0,800)}`:''}`:'(Bagian ini tidak punya slide.)'}
${prev?`Bagian sebelumnya: ${prev.title}.`:'Ini bagian PERTAMA: mulai dengan sapaan hangat dan perkenalan diri memakai nama guru, lalu sebut topik hari ini.'}
${next?`Bagian berikutnya: ${next.title}.`:'Ini bagian TERAKHIR: rekap materi (kosakata & poin utama), ajak foto bersama dengan kamera menyala, lalu salam penutup.'}
${p.slide&&p.slide.image?'Gambar terlampir adalah tampilan slide ini.':''}

Contoh gaya dari catatan guru sendiri:
EN: Now we have a conversation between Anna and Ben. Who wants to be Anna, and who wants to be Ben?
ID: Sekarang ada percakapan antara Anna dan Ben. Siapa yang mau jadi Anna, siapa yang mau jadi Ben?

Aturan:
- 2–8 baris, kalimat pendek yang benar-benar diucapkan guru, berurutan. Bahasa Inggrisnya sederhana sesuai level murid.
- Untuk kosakata baru, sebut cara baca di baris Indonesia (contoh: dibaca "rei-ni dei") dan artinya.
- Kalau ada pertanyaan/daftar pertanyaan di slide, masukkan pertanyaannya sebagai baris.
- "notes" (bahasa Indonesia, boleh kosong): arti kalimat bahasa Inggris di slide bila membantu, kunci jawaban bila ada soal (tulis "perkiraan" bila tidak yakin, misalnya jawaban bergantung pada video), dan tips waktu singkat.
Balas hanya JSON: {"lines":[{"en":"...","id":"..."}],"notes":"..."}`;
        try{
          const opts={signal}; if(p.slide&&p.slide.image&&sampleImages) opts.images=p.slide.image;
          const r=await sampleFn.json(input, opts);
          results[i]={lines:(Array.isArray(r&&r.lines)?r.lines:[]).filter(x=>x&&(x.en||x.id)).map(x=>({en:String(x.en||''),id:String(x.id||'')})), notes:String((r&&r.notes)||'')};
        }catch(e){
          if(e&&(e.code==='cancelled'||e.code==='not_granted')) throw e;
          failed++; results[i]={lines:[], notes:'Naskah slide ini gagal dibuat ('+(e&&e.code||'error')+'). Tulis manual atau coba upload ulang.'};
        }
        done++; steps[2].t=`Menulis naskah per slide ${done}/${plan.length}`; progList(steps,25+Math.round(done/plan.length*73));
      }
    };
    worker.taken=new Set();
    await Promise.all([worker(),worker(),worker()]);
    if(signal.aborted) throw {code:'cancelled'};

    await finishImport({id:uid(), title:String(outline.lessonTitle||impFile.name.replace(/\.(pdf|pptx)$/i,'')), classMin, startClock, lastActual:null,
      slides:plan.map((p,i)=>({id:uid(), title:p.title, sec:Math.round(p.minutes*60), kids:p.kids, page:p.slide?p.slide.n:null, lines:mkLines(results[i]?results[i].lines:[]), notes:(results[i]?results[i].notes:'').trim()}))}, failed, D, impFile.name);
    }
  }catch(e){
    if(e&&e.code) progMsg(e.code==='cancelled'?'info':'err', e.code==='cancelled'?'Dihentikan. Belum ada yang disimpan.':aiError(e));
    else progMsg('err', (e&&e.message)||'File tidak bisa dibaca. Coba simpan ulang sebagai PDF.');
  }
  const g=$('#impGo'); if(g){ g.disabled=!impFile; } const s=$('#impStop'); if(s) s.hidden=true;
  impCtl=null;
}

/* ---------- shell ---------- */
function fillPicker(){
  const p=$('#lessonPick');
  p.innerHTML=state.lessons.map(l=>`<option value="${l.id}" ${l.id===state.activeId?'selected':''}>${esc(l.title)}</option>`).join('');
}
function switchLesson(){ releaseWake(); run=freshRun(); saveRun(); openSlide=null; render(); }
$('#lessonPick').onchange=async e=>{
  const id=e.target.value;
  if(run.running){ fillPicker(); if(!await ask('Kelas sedang berjalan. Pindah materi akan mengulang timer. Lanjut?',{ok:'Pindah'})) return; }
  state.activeId=id; save(); switchLesson();
};
async function setView(v){
  if(impCtl && v!=='plan' && !await ask('Pembuatan rencana masih berjalan. Hentikan?',{ok:'Hentikan',danger:true})) return;
  if(impCtl) impCtl.abort();
  view=v; $('#tabTeach').setAttribute('aria-selected',v==='teach'); $('#tabPlan').setAttribute('aria-selected',v==='plan'); render();
}
$('#newMateri').onclick=newMateriDialog;
$('#tabTeach').onclick=()=>setView('teach'); $('#tabPlan').onclick=()=>setView('plan');
function render(){ fillPicker(); if(view==='teach'){ syncRunToLesson(); renderTeach(); } else { renderPlan(); renderControls(); } }
document.addEventListener('keydown',e=>{
  if(view!=='teach' || document.querySelector('.dlg-back')) return;
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); startPause(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); if(!run.running && run.base===0) startPause(); go(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); go(-1); }
});
initFirebase();
render();
</script>
</body>
